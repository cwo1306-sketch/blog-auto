[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "naver-cardnews"
version = "0.1.0"
description = "네이버 뉴스 수집 → 엑셀 큐 → 카드뉴스 제작 파이프라인 부품"
requires-python = ">=3.10"
dependencies = ["requests>=2.31", "openpyxl>=3.1", "PyYAML>=6.0", "Pillow>=10", "anthropic>=1.0", "playwright>=1.45"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools]
packages = ["naver_cardnews"]

[tool.setuptools.package-data]
naver_cardnews = []
