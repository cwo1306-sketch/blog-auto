<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>stat card</title>
<style>
  /* 숫자 카드(.card--stat). 로컬 templates/card.css에 이 블록을 합치면 된다. 변수는 card.css와 맞춤. */
  :root {
    --smoke: #848884; --smoke-dark: #2A2C2A; --yellow: #FFE500; --white: #FFFFFF; --grey-text: #B8BBB8;
    --font: "Pretendard", "Pretendard Variable", "Noto Sans CJK KR", "Noto Sans KR", "Apple SD Gothic Neo", sans-serif;
  }
  html, body { margin: 0; padding: 0; }
  body { width: 1080px; height: 1350px; overflow: hidden; background: var(--smoke-dark); font-family: var(--font); }
  .card { position: relative; width: 1080px; height: 1350px; overflow: hidden; color: var(--white);
          background: linear-gradient(160deg, var(--smoke-dark) 0%, #3b3d3b 55%, var(--smoke) 100%); }
  .card::after { /* 아주 약한 노이즈 텍스처 */
    content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .07;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='200' height='200' filter='url(%23n)'/></svg>");
  }
  .label { position: absolute; top: 56px; left: 64px; font-size: 26px; font-weight: 600; letter-spacing: .02em;
           color: var(--white); background: rgba(0,0,0,.35); padding: 10px 18px; border-radius: 999px; }
  .stat { position: absolute; left: 64px; right: 64px; top: 50%; transform: translateY(-58%); text-align: left; }
  .value { font-weight: 800; line-height: .95; color: var(--yellow); letter-spacing: -.03em; white-space: nowrap; }
  .value .unit { font-size: .42em; font-weight: 700; margin-left: .06em; }
  .value[data-len="short"]  { font-size: 360px; }
  .value[data-len="medium"] { font-size: 300px; }
  .value[data-len="long"]   { font-size: 240px; }
  .stat-label { margin-top: 48px; font-size: 52px; font-weight: 700; line-height: 1.25; }
  .quote { position: absolute; left: 64px; right: 64px; bottom: 150px; font-size: 32px; line-height: 1.5;
           color: var(--grey-text); border-left: 6px solid var(--yellow); padding-left: 24px;
           display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .page { position: absolute; right: 64px; bottom: 56px; font-size: 28px; color: var(--grey-text); }
</style>
</head>
<body>
<div class="card card--stat">
  <div class="label">{{label_top}}</div>
  <div class="stat">
    <div class="value" data-len="{{len_class}}"><span class="num">{{value}}<span class="unit">{{unit}}</span></span></div>
    <div class="stat-label">{{stat_label}}</div>
  </div>
  <div class="quote">{{quote}}</div>
  <div class="page">{{page_no}}/{{total}}</div>
</div>
</body>
</html>
